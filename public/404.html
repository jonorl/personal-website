<!DOCTYPE html>
<!-- Cloudflare Pages serves this with a 404 status for any path that does not exist. Without it, Pages falls back to
     index.html with a 200, so mistyped URLs and probes such as /.well-known/ai-catalog.json look like real pages. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.png" />
    <title>Page not found · Jonathan Orlowski</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1e293b;
        --muted: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f17;
          --fg: #f1f5f9;
          --muted: #94a3b8;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 0 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There is nothing at this address.</p>
      <a href="/">Go to jonathan-orlowski.dev</a>
    </main>
  </body>
</html>
