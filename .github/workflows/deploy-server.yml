name: Deploy metrics API

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

# Read-only by default; only build-and-deploy widens it, to push the image to GHCR.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check
        run: node --check server/index.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          push: true
          tags: ghcr.io/jonorl/metrics:latest
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        # Pinned to a commit because this third-party action receives the VPS SSH key, and tags can be moved.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            docker compose -f ~/my-VPS/infra/docker-compose.yml pull metrics
            docker compose -f ~/my-VPS/infra/docker-compose.yml up -d metrics

      # A green deploy only means the container was recreated; this waits until /health reports this commit.
      - name: Smoke test
        env:
          BASE: https://stats.jonathan-orlowski.dev
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 24); do
            health=$(curl -s --max-time 10 "$BASE/health" || true)
            if echo "$health" | jq -e --arg v "$EXPECTED_VERSION" '.status == "ok" and .version == $v' > /dev/null 2>&1; then
              echo "New version healthy after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "::error::/health did not report status ok for $EXPECTED_VERSION within two minutes. Last response: $health"
              exit 1
            fi
            sleep 5
          done
          curl -fsS --max-time 10 "$BASE/api/status" | jq -e '.services | type == "object"' > /dev/null \
            || { echo "::error::/api/status no longer returns services, which the status lights read"; exit 1; }
          echo "Smoke test passed"
