version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Vite and its plugins move together, including major versions,
      # so a Vite upgrade arrives with the plugin updates it needs.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "@tailwindcss/vite"
      # One PR a week for routine bumps; other majors still come separately.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet (its peer range stops below 6.1); drop this once it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
    ignore:
      # Odd-numbered Node releases never become LTS, so moving to the next LTS major is done by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"